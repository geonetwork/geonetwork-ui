@if (kind) {
  <div
    [class]="badgeClasses"
    [title]="'record.kind.' + displayKind | translate"
  >
    <ng-icon
      [name]="iconKind"
      [ngClass]="extraClass"
      aria-hidden="true"
    ></ng-icon>
    @if (contentTemplate) {
      <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
    } @else {
      {{ 'record.kind.' + displayKind | translate }}
    }
  </div>
}
