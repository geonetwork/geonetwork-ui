<gn-ui-autocomplete
  [action]="searchAction"
  [displayWithFn]="displayWithFn"
  [placeholder]="placeholder"
  [displayWithTemplate]="displayWithTemplate ?? defaultItemTpl"
  (itemSelected)="handleItemSelected($event)"
>
</gn-ui-autocomplete>

<ng-template #defaultItemTpl let-result>
  <div class="py-2">
    @if (getSecondaryLabel(result)) {
      <div class="gn-ui-card-detail">{{ getSecondaryLabel(result) }}</div>
    }
    <div class="gn-ui-card-title">{{ getMainLabel(result) }}</div>
  </div>
</ng-template>
