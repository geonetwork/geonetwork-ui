@if (fieldType === 'dateRange') {
  <gn-ui-date-range-dropdown
    [title]="title"
    [dateRange]="(selectedDateRange$ | async) ?? {}"
    (dateRangeChange)="onDateRangeChange($event)"
    [attr.data-cy-field]="fieldName"
  ></gn-ui-date-range-dropdown>
} @else if (fieldType === 'spatialExtent') {
  <gn-ui-spatial-extent-dropdown
    [title]="title"
    [initialBbox]="(selectedBoundingBox$ | async) ?? null"
    [maxFileSizeMb]="spatialExtentMaxFileSize"
    [showFileUpload]="spatialExtentSources.includes('file')"
    [showLocationSearch]="spatialExtentSources.includes('service')"
    (bboxChange)="onBboxChange($event)"
    (errorChange)="onSpatialExtentError($event)"
    [attr.data-cy-field]="fieldName"
  >
    @if (spatialExtentSources.includes('service')) {
      <gn-ui-location-search
        [placeholder]="
          'search.filters.spatialExtent.searchLocation' | translate
        "
        (bboxSelected)="onLocationSelected($event)"
        data-cy="locationSearch"
      ></gn-ui-location-search>
    }
  </gn-ui-spatial-extent-dropdown>
} @else {
  <gn-ui-dropdown-multiselect
    class="w-full"
    [title]="title"
    [maxRows]="6"
    [choices]="(choices$ | async) || []"
    [selected]="selected$ | async"
    [allowSearch]="true"
    (selectValues)="onSelectedValues($event)"
    [attr.data-cy-field]="fieldName"
  >
  </gn-ui-dropdown-multiselect>
}
